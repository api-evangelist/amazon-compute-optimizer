        $ref: '#/components/schemas/Tag'
    ServiceArn:
      type: string
    GetRecommendationErrors:
      type: array
      items:
        $ref: '#/components/schemas/GetRecommendationError'
    Identifier:
      type: string
    ContainerName:
      type: string
    ECSServiceProjectedUtilizationMetric:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/ECSServiceMetricName'
          - description: <p> The name of the projected utilization metric. </p> <p>The following utilization metrics are available:</p> <ul> <li> <p> <code>Cpu</code> — The percentage of allocated compute units that are currently in use on the service tasks.</p> </li> <li> <p> <code>Memory</code> — The percentage of memory that's currently in use on the service tasks.</p> </li> </ul>
        statistic:
          allOf:
          - $ref: '#/components/schemas/ECSServiceMetricStatistic'
          - description: <p>The statistic of the projected utilization metric.</p> <p>The Compute Optimizer API, Command Line Interface (CLI), and SDKs return utilization metrics using only the <code>Maximum</code> statistic, which is the highest value observed during the specified period.</p> <p>The Compute Optimizer console displays graphs for some utilization metrics using the <code>Average</code> statistic, which is the value of <code>Sum</code> / <code>SampleCount</code> during the specified period. For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/viewing-recommendations.html">Viewing resource recommendations</a> in the <i>Compute Optimizer User Guide</i>. You can also get averaged utilization metric data for your resources using Amazon CloudWatch. For more information, see the <a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html">Amazon CloudWatch User Guide</a>.</p>
        lowerBoundValue:
          allOf:
          - $ref: '#/components/schemas/LowerBoundValue'
          - description: ' The lower bound values for the projected utilization metrics. '
        upperBoundValue:
          allOf:
          - $ref: '#/components/schemas/UpperBoundValue'
          - description: ' The upper bound values for the projected utilization metrics. '
      description: <p> Describes the projected utilization metrics of an Amazon ECS service recommendation option. </p> <p>To determine the performance difference between your current Amazon ECS service and the recommended option, compare the utilization metric data of your service against its projected utilization metric data.</p>
    FilterValue:
      type: string
    ECSServiceRecommendation:
      type: object
      properties:
        serviceArn:
          allOf:
          - $ref: '#/components/schemas/ServiceArn'
          - description: '<p> The Amazon Resource Name (ARN) of the current Amazon ECS service. </p> <p> The following is the format of the ARN: </p> <p> <code>arn:aws:ecs:region:aws_account_id:service/cluster-name/service-name</code> </p>'
        accountId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - description: ' The Amazon Web Services account ID of the Amazon ECS service. '
        currentServiceConfiguration:
          allOf:
          - $ref: '#/components/schemas/ServiceConfiguration'
          - description: ' The configuration of the current Amazon ECS service. '
        utilizationMetrics:
          allOf:
          - $ref: '#/components/schemas/ECSServiceUtilizationMetrics'
          - description: ' An array of objects that describe the utilization metrics of the Amazon ECS service. '
        lookbackPeriodInDays:
          allOf:
          - $ref: '#/components/schemas/LookBackPeriodInDays'
          - description: ' The number of days the Amazon ECS service utilization metrics were analyzed. '
        launchType:
          allOf:
          - $ref: '#/components/schemas/ECSServiceLaunchType'
          - description: <p> The launch type the Amazon ECS service is using. </p> <note> <p>Compute Optimizer only supports the Fargate launch type.</p> </note>
        lastRefreshTimestamp:
          allOf:
          - $ref: '#/components/schemas/LastRefreshTimestamp'
          - description: ' The timestamp of when the Amazon ECS service recommendation was last generated. '
        finding:
          allOf:
          - $ref: '#/components/schemas/ECSServiceRecommendationFinding'
          - description: <p> The finding classification of an Amazon ECS service. </p> <p>Findings for Amazon ECS services include:</p> <ul> <li> <p> <b> <code>Underprovisioned</code> </b> — When Compute Optimizer detects that there’s not enough memory or CPU, an Amazon ECS service is considered under-provisioned. An under-provisioned service might result in poor application performance.</p> </li> <li> <p> <b> <code>Overprovisioned</code> </b> — When Compute Optimizer detects that there’s excessive memory or CPU, an Amazon ECS service is considered over-provisioned. An over-provisioned service might result in additional infrastructure costs. </p> </li> <li> <p> <b> <code>Optimized</code> </b> — When both the CPU and memory of your Amazon ECS service meet the performance requirements of your workload, the service is considered optimized.</p> </li> </ul>
        findingReasonCodes:
          allOf:
          - $ref: '#/components/schemas/ECSServiceRecommendationFindingReasonCodes'
          - description: <p> The reason for the finding classification of an Amazon ECS service. </p> <p>Finding reason codes for Amazon ECS services include:</p> <ul> <li> <p> <b> <code>CPUUnderprovisioned</code> </b> — The service CPU configuration can be sized up to enhance the performance of your workload. This is identified by analyzing the <code>CPUUtilization</code> metric of the current service during the look-back period.</p> </li> <li> <p> <b> <code>CPUOverprovisioned</code> </b> — The service CPU configuration can be sized down while still meeting the performance requirements of your workload. This is identified by analyzing the <code>CPUUtilization</code> metric of the current service during the look-back period. </p> </li> <li> <p> <b> <code>MemoryUnderprovisioned</code> </b> — The service memory configuration can be sized up to enhance the performance of your workload. This is identified by analyzing the <code>MemoryUtilization</code> metric of the current service during the look-back period.</p> </li> <li> <p> <b> <code>MemoryOverprovisioned</code> </b> — The service memory configuration can be sized down while still meeting the performance requirements of your workload. This is identified by analyzing the <code>MemoryUtilization</code> metric of the current service during the look-back period.</p> </li> </ul>
        serviceRecommendationOptions:
          allOf:
          - $ref: '#/components/schemas/ECSServiceRecommendationOptions'
          - description: ' An array of objects that describe the recommendation options for the Amazon ECS service. '
        currentPerformanceRisk:
          allOf:
          - $ref: '#/components/schemas/CurrentPerformanceRisk'
          - description: ' The risk of the current Amazon ECS service not meeting the performance needs of its workloads. The higher the risk, the more likely the current service can''t meet the performance requirements of its workload. '
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: ' A list of tags assigned to your Amazon ECS service recommendations. '
      description: ' Describes an Amazon ECS service recommendation. '
    TagKey:
      type: string
    MemorySizeConfiguration:
      type: object
      properties:
        memory:
          allOf:
          - $ref: '#/components/schemas/NullableMemory'
          - description: ' The amount of memory in the container. '
        memoryReservation:
          allOf:
          - $ref: '#/components/schemas/NullableMemoryReservation'
          - description: ' The limit of memory reserve for the container. '
      description: ' The memory size configurations of a container. '
    ECSServiceMetricName:
      type: string
      enum:
      - Cpu
      - Memory

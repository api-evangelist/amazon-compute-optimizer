security:
- hmac: []
tags:
- name: '#X Amz Target=ComputeOptimizerService.ExportLambdaFunctionRecommendations'
paths:
  /#X-Amz-Target=ComputeOptimizerService.ExportLambdaFunctionRecommendations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ExportLambdaFunctionRecommendations
      description: <p>Exports optimization recommendations for Lambda functions.</p> <p>Recommendations are exported in a comma-separated values (.csv) file, and its metadata in a JavaScript Object Notation (JSON) (.json) file, to an existing Amazon Simple Storage Service (Amazon S3) bucket that you specify. For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html">Exporting Recommendations</a> in the <i>Compute Optimizer User Guide</i>.</p> <p>You can have only one Lambda function export job in progress per Amazon Web Services Region.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLambdaFunctionRecommendationsResponse'
              examples:
                ExportLambdaFunctionRecommendations200Example:
                  summary: Default ExportLambdaFunctionRecommendations 200
                  x-microcks-default: true
                  value:
                    jobId: example
                    s3Destination:
                      bucket: {}
                      key: {}
                      metadataKey: {}
        '480':
          description: OptInRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptInRequiredException'
              examples:
                ExportLambdaFunctionRecommendations480Example:
                  summary: Default ExportLambdaFunctionRecommendations 480
                  x-microcks-default: true
                  value: example
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                ExportLambdaFunctionRecommendations481Example:
                  summary: Default ExportLambdaFunctionRecommendations 481
                  x-microcks-default: true
                  value: example
        '482':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
              examples:
                ExportLambdaFunctionRecommendations482Example:
                  summary: Default ExportLambdaFunctionRecommendations 482
                  x-microcks-default: true
                  value: example
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                ExportLambdaFunctionRecommendations483Example:
                  summary: Default ExportLambdaFunctionRecommendations 483
                  x-microcks-default: true
                  value: example
        '484':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
              examples:
                ExportLambdaFunctionRecommendations484Example:
                  summary: Default ExportLambdaFunctionRecommendations 484
                  x-microcks-default: true
                  value: example
        '485':
          description: MissingAuthenticationToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingAuthenticationToken'
              examples:
                ExportLambdaFunctionRecommendations485Example:
                  summary: Default ExportLambdaFunctionRecommendations 485
                  x-microcks-default: true
                  value: example
        '486':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                ExportLambdaFunctionRecommendations486Example:
                  summary: Default ExportLambdaFunctionRecommendations 486
                  x-microcks-default: true
                  value: example
        '487':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
              examples:
                ExportLambdaFunctionRecommendations487Example:
                  summary: Default ExportLambdaFunctionRecommendations 487
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportLambdaFunctionRecommendationsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - ComputeOptimizerService.ExportLambdaFunctionRecommendations
      summary: Amazon Compute Optimizer Export Lambda Function Recommendations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=ComputeOptimizerService.ExportLambdaFunctionRecommendations'
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    MetadataKey:
      type: string
    IncludeMemberAccounts:
      type: boolean
    ExportLambdaFunctionRecommendationsRequest:
      type: object
      required:
      - s3DestinationConfig
      title: ExportLambdaFunctionRecommendationsRequest
      properties:
        accountIds:
          allOf:
          - $ref: '#/components/schemas/AccountIds'
          - description: <p>The IDs of the Amazon Web Services accounts for which to export Lambda function recommendations.</p> <p>If your account is the management account of an organization, use this parameter to specify the member account for which you want to export recommendations.</p> <p>This parameter cannot be specified together with the include member accounts parameter. The parameters are mutually exclusive.</p> <p>Recommendations for member accounts are not included in the export if this parameter, or the include member accounts parameter, is omitted.</p> <p>You can specify multiple account IDs per request.</p>
        filters:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFilters'
          - description: An array of objects to specify a filter that exports a more specific set of Lambda function recommendations.
        fieldsToExport:
          allOf:
          - $ref: '#/components/schemas/ExportableLambdaFunctionFields'
          - description: The recommendations data to include in the export file. For more information about the fields that can be exported, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html#exported-files">Exported files</a> in the <i>Compute Optimizer User Guide</i>.
        s3DestinationConfig:
          $ref: '#/components/schemas/S3DestinationConfig'
        fileFormat:
          allOf:
          - $ref: '#/components/schemas/FileFormat'
          - description: <p>The format of the export file.</p> <p>The only export file format currently supported is <code>Csv</code>.</p>
        includeMemberAccounts:
          allOf:
          - $ref: '#/components/schemas/IncludeMemberAccounts'
          - description: <p>Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.</p> <p>The member accounts must also be opted in to Compute Optimizer, and trusted access for Compute Optimizer must be enabled in the organization account. For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/security-iam.html#trusted-service-access">Compute Optimizer and Amazon Web Services Organizations trusted access</a> in the <i>Compute Optimizer User Guide</i>.</p> <p>Recommendations for member accounts of the organization are not included in the export file if this parameter is omitted.</p> <p>This parameter cannot be specified together with the account IDs parameter. The parameters are mutually exclusive.</p> <p>Recommendations for member accounts are not included in the export if this parameter, or the account IDs parameter, is omitted.</p>
    InternalServerException: {}
    ThrottlingException: {}
    S3DestinationConfig:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/DestinationBucket'
          - description: The name of the Amazon S3 bucket to use as the destination for an export job.
        keyPrefix:
          allOf:
          - $ref: '#/components/schemas/DestinationKeyPrefix'
          - description: The Amazon S3 bucket prefix for an export job.
      description: <p>Describes the destination Amazon Simple Storage Service (Amazon S3) bucket name and key prefix for a recommendations export job.</p> <p>You must create the destination Amazon S3 bucket for your recommendations export before you create the export job. Compute Optimizer does not create the S3 bucket for you. After you create the S3 bucket, ensure that it has the required permission policy to allow Compute Optimizer to write the export file to it. If you plan to specify an object prefix when you create the export job, you must include the object prefix in the policy that you add to the S3 bucket. For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/create-s3-bucket-policy-for-compute-optimizer.html">Amazon S3 Bucket Policy for Compute Optimizer</a> in the <i>Compute Optimizer User Guide</i>.</p>
    ServiceUnavailableException: {}
    AccountId:
      type: string
    LimitExceededException: {}
    DestinationBucket:
      type: string
    MissingAuthenticationToken: {}
    JobId:
      type: string
    LambdaFunctionRecommendationFilters:
      type: array
      items:
        $ref: '#/components/schemas/LambdaFunctionRecommendationFilter'
    AccountIds:
      type: array
      items:
        $ref: '#/components/schemas/AccountId'
    ExportLambdaFunctionRecommendationsResponse:
      type: object
      properties:
        jobId:
          allOf:
          - $ref: '#/components/schemas/JobId'
          - description: <p>The identification number of the export job.</p> <p>Use the <a>DescribeRecommendationExportJobs</a> action, and specify the job ID to view the status of an export job.</p>
        s3Destination:
          $ref: '#/components/schemas/S3Destination'
    DestinationKeyPrefix:
      type: string
    FilterValues:
      type: array
      items:
        $ref: '#/components/schemas/FilterValue'
    OptInRequiredException: {}
    InvalidParameterValueException: {}
    ExportableLambdaFunctionField:
      type: string
      enum:
      - AccountId
      - FunctionArn
      - FunctionVersion
      - Finding
      - FindingReasonCodes
      - NumberOfInvocations
      - UtilizationMetricsDurationMaximum
      - UtilizationMetricsDurationAverage
      - UtilizationMetricsMemoryMaximum
      - UtilizationMetricsMemoryAverage
      - LookbackPeriodInDays
      - CurrentConfigurationMemorySize
      - CurrentConfigurationTimeout
      - CurrentCostTotal
      - CurrentCostAverage
      - RecommendationOptionsConfigurationMemorySize
      - RecommendationOptionsCostLow
      - RecommendationOptionsCostHigh
      - RecommendationOptionsProjectedUtilizationMetricsDurationLowerBound
      - RecommendationOptionsProjectedUtilizationMetricsDurationUpperBound
      - RecommendationOptionsProjectedUtilizationMetricsDurationExpected
      - LastRefreshTimestamp
      - CurrentPerformanceRisk
      - RecommendationOptionsSavingsOpportunityPercentage
      - RecommendationOptionsEstimatedMonthlySavingsCurrency
      - RecommendationOptionsEstimatedMonthlySavingsValue
      - Tags
    FileFormat:
      type: string
      enum:
      - Csv
    LambdaFunctionRecommendationFilterName:
      type: string
      enum:
      - Finding
      - FindingReasonCode
    ExportableLambdaFunctionFields:
      type: array
      items:
        $ref: '#/components/schemas/ExportableLambdaFunctionField'
    S3Destination:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/DestinationBucket'
          - description: The name of the Amazon S3 bucket used as the destination of an export file.
        key:
          allOf:
          - $ref: '#/components/schemas/DestinationKey'
          - description: <p>The Amazon S3 bucket key of an export file.</p> <p>The key uniquely identifies the object, or export file, in the S3 bucket.</p>
        metadataKey:
          allOf:
          - $ref: '#/components/schemas/MetadataKey'
          - description: <p>The Amazon S3 bucket key of a metadata file.</p> <p>The key uniquely identifies the object, or metadata file, in the S3 bucket.</p>
      description: Describes the destination Amazon Simple Storage Service (Amazon S3) bucket name and object keys of a recommendations export file, and its associated metadata file.
    AccessDeniedException: {}
    DestinationKey:
      type: string
    FilterValue:
      type: string
    LambdaFunctionRecommendationFilter:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFilterName'
          - description: <p>The name of the filter.</p> <p>Specify <code>Finding</code> to return recommendations with a specific finding classification (for example, <code>NotOptimized</code>).</p> <p>Specify <code>FindingReasonCode</code> to return recommendations with a specific finding reason code (for example, <code>MemoryUnderprovisioned</code>).</p> <p>You can filter your Lambda function recommendations by <code>tag:key</code> and <code>tag-key</code> tags.</p> <p>A <code>tag:key</code> is a key and value combination of a tag assigned to your Lambda function recommendations. Use the tag key in the filter name and the tag value as the filter value. For example, to find all Lambda function recommendations that have a tag with the key of <code>Owner</code> and the value of <code>TeamA</code>, specify <code>tag:Owner</code> for the filter name and <code>TeamA</code> for the filter value.</p> <p>A <code>tag-key</code> is the key of a tag assigned to your Lambda function recommendations. Use this filter to find all of your Lambda function recommendations that have a tag with a specific key. This doesn’t consider the tag value. For example, you can find your Lambda function recommendations with a tag key value of <code>Owner</code> or without any tag keys assigned.</p>
        values:
          allOf:
          - $ref: '#/components/schemas/FilterValues'
          - description: <p>The value of the filter.</p> <p>The valid values for this parameter are as follows, depending on what you specify for the <code>name</code> parameter:</p> <ul> <li> <p>Specify <code>Optimized</code>, <code>NotOptimized</code>, or <code>Unavailable</code> if you specify the <code>name</code> parameter as <code>Finding</code>.</p> </li> <li> <p>Specify <code>MemoryOverprovisioned</code>, <code>MemoryUnderprovisioned</code>, <code>InsufficientData</code>, or <code>Inconclusive</code> if you specify the <code>name</code> parameter as <code>FindingReasonCode</code>.</p> </li> </ul>
      description: <p>Describes a filter that returns a more specific list of Lambda function recommendations. Use this filter with the <a>GetLambdaFunctionRecommendations</a> action.</p> <p>You can use <code>EBSFilter</code> with the <a>GetEBSVolumeRecommendations</a> action, <code>JobFilter</code> with the <a>DescribeRecommendationExportJobs</a> action, and <code>Filter</code> with the <a>GetAutoScalingGroupRecommendations</a> and <a>GetEC2InstanceRecommendations</a> actions.</p>
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4

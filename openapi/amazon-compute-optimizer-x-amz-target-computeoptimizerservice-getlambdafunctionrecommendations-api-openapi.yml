components:
  schemas:
    FilterValue:
      type: string
    LambdaFunctionRecommendationFilters:
      type: array
      items:
        $ref: '#/components/schemas/LambdaFunctionRecommendationFilter'
    LambdaFunctionMemoryRecommendationOption:
      type: object
      properties:
        rank:
          allOf:
          - $ref: '#/components/schemas/Rank'
          - description: <p>The rank of the function recommendation option.</p> <p>The top recommendation option is ranked as <code>1</code>.</p>
        memorySize:
          allOf:
          - $ref: '#/components/schemas/MemorySize'
          - description: The memory size, in MB, of the function recommendation option.
        projectedUtilizationMetrics:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMemoryProjectedMetrics'
          - description: An array of objects that describe the projected utilization metrics of the function recommendation option.
        savingsOpportunity:
          allOf:
          - $ref: '#/components/schemas/SavingsOpportunity'
          - description: An object that describes the savings opportunity for the Lambda function recommendation option. Savings opportunity includes the estimated monthly savings amount and percentage.
      description: Describes a recommendation option for an Lambda function.
    MaxResults:
      type: integer
      minimum: 0
      maximum: 1000
    MetricValue:
      type: number
      format: double
    Tag:
      type: object
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: ' One part of a key-value pair that makes up a tag. A key is a general label that acts like a category for more specific tag values. '
        value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: ' One part of a key-value pair that make up a tag. A value acts as a descriptor within a tag category (key). The value can be empty or null. '
      description: ' A list of tag key and value pairs that you define. '
    NextToken:
      type: string
    GetLambdaFunctionRecommendationsRequest:
      type: object
      title: GetLambdaFunctionRecommendationsRequest
      properties:
        functionArns:
          allOf:
          - $ref: '#/components/schemas/FunctionArns'
          - description: <p>The Amazon Resource Name (ARN) of the functions for which to return recommendations.</p> <p>You can specify a qualified or unqualified ARN. If you specify an unqualified ARN without a function version suffix, Compute Optimizer will return recommendations for the latest (<code>$LATEST</code>) version of the function. If you specify a qualified ARN with a version suffix, Compute Optimizer will return recommendations for the specified function version. For more information about using function versions, see <a href="https://docs.aws.amazon.com/lambda/latest/dg/configuration-versions.html#versioning-versions-using">Using versions</a> in the <i>Lambda Developer Guide</i>.</p>
        accountIds:
          allOf:
          - $ref: '#/components/schemas/AccountIds'
          - description: <p>The ID of the Amazon Web Services account for which to return function recommendations.</p> <p>If your account is the management account of an organization, use this parameter to specify the member account for which you want to return function recommendations.</p> <p>Only one account ID can be specified per request.</p>
        filters:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFilters'
          - description: An array of objects to specify a filter that returns a more specific list of function recommendations.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: The token to advance to the next page of function recommendations.
        maxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: <p>The maximum number of function recommendations to return with a single request.</p> <p>To retrieve the remaining results, make another request with the returned <code>nextToken</code> value.</p>
    LambdaFunctionMetricName:
      type: string
      enum:
      - Duration
      - Memory
    ServiceUnavailableException: {}
    LambdaFunctionMemoryMetricStatistic:
      type: string
      enum:
      - LowerBound
      - UpperBound
      - Expected
    Tags:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    FunctionArn:
      type: string
    Rank:
      type: integer
    LimitExceededException: {}
    InternalServerException: {}
    LambdaFunctionRecommendationFilter:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFilterName'
          - description: <p>The name of the filter.</p> <p>Specify <code>Finding</code> to return recommendations with a specific finding classification (for example, <code>NotOptimized</code>).</p> <p>Specify <code>FindingReasonCode</code> to return recommendations with a specific finding reason code (for example, <code>MemoryUnderprovisioned</code>).</p> <p>You can filter your Lambda function recommendations by <code>tag:key</code> and <code>tag-key</code> tags.</p> <p>A <code>tag:key</code> is a key and value combination of a tag assigned to your Lambda function recommendations. Use the tag key in the filter name and the tag value as the filter value. For example, to find all Lambda function recommendations that have a tag with the key of <code>Owner</code> and the value of <code>TeamA</code>, specify <code>tag:Owner</code> for the filter name and <code>TeamA</code> for the filter value.</p> <p>A <code>tag-key</code> is the key of a tag assigned to your Lambda function recommendations. Use this filter to find all of your Lambda function recommendations that have a tag with a specific key. This doesn’t consider the tag value. For example, you can find your Lambda function recommendations with a tag key value of <code>Owner</code> or without any tag keys assigned.</p>
        values:
          allOf:
          - $ref: '#/components/schemas/FilterValues'
          - description: <p>The value of the filter.</p> <p>The valid values for this parameter are as follows, depending on what you specify for the <code>name</code> parameter:</p> <ul> <li> <p>Specify <code>Optimized</code>, <code>NotOptimized</code>, or <code>Unavailable</code> if you specify the <code>name</code> parameter as <code>Finding</code>.</p> </li> <li> <p>Specify <code>MemoryOverprovisioned</code>, <code>MemoryUnderprovisioned</code>, <code>InsufficientData</code>, or <code>Inconclusive</code> if you specify the <code>name</code> parameter as <code>FindingReasonCode</code>.</p> </li> </ul>
      description: <p>Describes a filter that returns a more specific list of Lambda function recommendations. Use this filter with the <a>GetLambdaFunctionRecommendations</a> action.</p> <p>You can use <code>EBSFilter</code> with the <a>GetEBSVolumeRecommendations</a> action, <code>JobFilter</code> with the <a>DescribeRecommendationExportJobs</a> action, and <code>Filter</code> with the <a>GetAutoScalingGroupRecommendations</a> and <a>GetEC2InstanceRecommendations</a> actions.</p>
    SavingsOpportunity:
      type: object
      properties:
        savingsOpportunityPercentage:
          allOf:
          - $ref: '#/components/schemas/SavingsOpportunityPercentage'
          - description: The estimated monthly savings possible as a percentage of monthly cost by adopting Compute Optimizer recommendations for a given resource.
        estimatedMonthlySavings:
          allOf:
          - $ref: '#/components/schemas/EstimatedMonthlySavings'
          - description: An object that describes the estimated monthly savings amount possible by adopting Compute Optimizer recommendations for a given resource. This is based on the On-Demand instance pricing..
      description: <p>Describes the savings opportunity for recommendations of a given resource type or for the recommendation option of an individual resource.</p> <p>Savings opportunity represents the estimated monthly savings you can achieve by implementing a given Compute Optimizer recommendation.</p> <important> <p>Savings opportunity data requires that you opt in to Cost Explorer, as well as activate <b>Receive Amazon EC2 resource recommendations</b> in the Cost Explorer preferences page. That creates a connection between Cost Explorer and Compute Optimizer. With this connection, Cost Explorer generates savings estimates considering the price of existing resources, the price of recommended resources, and historical usage data. Estimated monthly savings reflects the projected dollar savings associated with each of the recommendations generated. For more information, see <a href="https://docs.aws.amazon.com/cost-management/latest/userguide/ce-enable.html">Enabling Cost Explorer</a> and <a href="https://docs.aws.amazon.com/cost-management/latest/userguide/ce-rightsizing.html">Optimizing your cost with Rightsizing Recommendations</a> in the <i>Cost Management User Guide</i>.</p> </important>
    LambdaFunctionRecommendations:
      type: array
      items:
        $ref: '#/components/schemas/LambdaFunctionRecommendation'
    LambdaFunctionRecommendationFilterName:
      type: string
      enum:
      - Finding
      - FindingReasonCode
    MissingAuthenticationToken: {}
    InvalidParameterValueException: {}
    LambdaFunctionRecommendation:
      type: object
      properties:
        functionArn:
          allOf:
          - $ref: '#/components/schemas/FunctionArn'
          - description: The Amazon Resource Name (ARN) of the current function.
        functionVersion:
          allOf:
          - $ref: '#/components/schemas/FunctionVersion'
          - description: The version number of the current function.
        accountId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          - description: The Amazon Web Services account ID of the function.
        currentMemorySize:
          allOf:
          - $ref: '#/components/schemas/MemorySize'
          - description: The amount of memory, in MB, that's allocated to the current function.
        numberOfInvocations:
          allOf:
          - $ref: '#/components/schemas/NumberOfInvocations'
          - description: The number of times your function code was applied during the look-back period.
        utilizationMetrics:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionUtilizationMetrics'
          - description: An array of objects that describe the utilization metrics of the function.
        lookbackPeriodInDays:
          allOf:
          - $ref: '#/components/schemas/LookBackPeriodInDays'
          - description: The number of days for which utilization metrics were analyzed for the function.
        lastRefreshTimestamp:
          allOf:
          - $ref: '#/components/schemas/LastRefreshTimestamp'
          - description: The timestamp of when the function recommendation was last generated.
        finding:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFinding'
          - description: <p>The finding classification of the function.</p> <p>Findings for functions include:</p> <ul> <li> <p> <b> <code>Optimized</code> </b> — The function is correctly provisioned to run your workload based on its current configuration and its utilization history. This finding classification does not include finding reason codes.</p> </li> <li> <p> <b> <code>NotOptimized</code> </b> — The function is performing at a higher level (over-provisioned) or at a lower level (under-provisioned) than required for your workload because its current configuration is not optimal. Over-provisioned resources might lead to unnecessary infrastructure cost, and under-provisioned resources might lead to poor application performance. This finding classification can include the <code>MemoryUnderprovisioned</code> and <code>MemoryUnderprovisioned</code> finding reason codes.</p> </li> <li> <p> <b> <code>Unavailable</code> </b> — Compute Optimizer was unable to generate a recommendation for the function. This could be because the function has not accumulated sufficient metric data, or the function does not qualify for a recommendation. This finding classification can include the <code>InsufficientData</code> and <code>Inconclusive</code> finding reason codes.</p> <note> <p>Functions with a finding of unavailable are not returned unless you specify the <code>filter</code> parameter with a value of <code>Unavailable</code> in your <code>GetLambdaFunctionRecommendations</code> request.</p> </note> </li> </ul>
        findingReasonCodes:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionRecommendationFindingReasonCodes'
          - description: <p>The reason for the finding classification of the function.</p> <note> <p>Functions that have a finding classification of <code>Optimized</code> don't have a finding reason code.</p> </note> <p>Finding reason codes for functions include:</p> <ul> <li> <p> <b> <code>MemoryOverprovisioned</code> </b> — The function is over-provisioned when its memory configuration can be sized down while still meeting the performance requirements of your workload. An over-provisioned function might lead to unnecessary infrastructure cost. This finding reason code is part of the <code>NotOptimized</code> finding classification.</p> </li> <li> <p> <b> <code>MemoryUnderprovisioned</code> </b> — The function is under-provisioned when its memory configuration doesn't meet the performance requirements of the workload. An under-provisioned function might lead to poor application performance. This finding reason code is part of the <code>NotOptimized</code> finding classification.</p> </li> <li> <p> <b> <code>InsufficientData</code> </b> — The function does not have sufficient metric data for Compute Optimizer to generate a recommendation. For more information, see the <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html">Supported resources and requirements</a> in the <i>Compute Optimizer User Guide</i>. This finding reason code is part of the <code>Unavailable</code> finding classification.</p> </li> <li> <p> <b> <code>Inconclusive</code> </b> — The function does not qualify for a recommendation because Compute Optimizer cannot generate a recommendation with a high degree of confidence. This finding reason code is part of the <code>Unavailable</code> finding classification.</p> </li> </ul>
        memorySizeRecommendationOptions:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMemoryRecommendationOptions'
          - description: An array of objects that describe the memory configuration recommendation options for the function.
        currentPerformanceRisk:
          allOf:
          - $ref: '#/components/schemas/CurrentPerformanceRisk'
          - description: The risk of the current Lambda function not meeting the performance needs of its workloads. The higher the risk, the more likely the current Lambda function requires more memory.
        tags:
          allOf:
          - $ref: '#/components/schemas/Tags'
          - description: ' A list of tags assigned to your Lambda function recommendations. '
      description: Describes an Lambda function recommendation.
    LambdaFunctionRecommendationFinding:
      type: string
      enum:
      - Optimized
      - NotOptimized
      - Unavailable
    AccessDeniedException: {}
    FunctionVersion:
      type: string
    TagKey:
      type: string
    ThrottlingException: {}
    LambdaFunctionUtilizationMetric:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMetricName'
          - description: <p>The name of the utilization metric.</p> <p>The following utilization metrics are available:</p> <ul> <li> <p> <code>Duration</code> - The amount of time that your function code spends processing an event.</p> </li> <li> <p> <code>Memory</code> - The amount of memory used per invocation.</p> </li> </ul>
        statistic:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMetricStatistic'
          - description: <p>The statistic of the utilization metric.</p> <p>The Compute Optimizer API, Command Line Interface (CLI), and SDKs return utilization metrics using only the <code>Maximum</code> statistic, which is the highest value observed during the specified period.</p> <p>The Compute Optimizer console displays graphs for some utilization metrics using the <code>Average</code> statistic, which is the value of <code>Sum</code> / <code>SampleCount</code> during the specified period. For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/viewing-recommendations.html">Viewing resource recommendations</a> in the <i>Compute Optimizer User Guide</i>. You can also get averaged utilization metric data for your resources using Amazon CloudWatch. For more information, see the <a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html">Amazon CloudWatch User Guide</a>.</p>
        value:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          - description: The value of the utilization metric.
      description: Describes a utilization metric of an Lambda function.
    LambdaFunctionRecommendationFindingReasonCode:
      type: string
      enum:
      - MemoryOverprovisioned
      - MemoryUnderprovisioned
      - InsufficientData
      - Inconclusive
    LambdaFunctionMetricStatistic:
      type: string
      enum:
      - Maximum
      - Average
    EstimatedMonthlySavings:
      type: object
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - description: The currency of the estimated monthly savings.
        value:
          allOf:
          - $ref: '#/components/schemas/Value'
          - description: The value of the estimated monthly savings.
      description: <p>Describes the estimated monthly savings amount possible, based on On-Demand instance pricing, by adopting Compute Optimizer recommendations for a given resource.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-ec2-recommendations.html#ec2-savings-calculation">Estimated monthly savings and savings opportunities</a> in the <i>Compute Optimizer User Guide</i>.</p>
    FunctionArns:
      type: array
      items:
        $ref: '#/components/schemas/FunctionArn'
    LambdaFunctionMemoryMetricName:
      type: string
      enum:
      - Duration
    TagValue:
      type: string
    LambdaFunctionMemoryRecommendationOptions:
      type: array
      items:
        $ref: '#/components/schemas/LambdaFunctionMemoryRecommendationOption'
    OptInRequiredException: {}
    LambdaFunctionMemoryProjectedMetrics:
      type: array
      items:
        $ref: '#/components/schemas/LambdaFunctionMemoryProjectedMetric'
    LambdaFunctionMemoryProjectedMetric:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMemoryMetricName'
          - description: The name of the projected utilization metric.
        statistic:
          allOf:
          - $ref: '#/components/schemas/LambdaFunctionMemoryMetricStatistic'
          - description: The statistic of the projected utilization metric.
        value:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          - description: The values of the projected utilization metrics.
      description: Describes a projected utilization metric of an Lambda function recommendation option.
    Currency:
      type: string
      enum:
      - USD
      - CNY
    LastRefreshTimestamp:
      type: string
      format: date-time
    LookBackPeriodInDays:
      type: number
      format: double
    LambdaFunctionUtilizationMetrics:
